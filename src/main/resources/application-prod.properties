# Production Profile Configuration
# This profile is used for production deployments with debugging disabled

# Camel Debug configuration - Disabled for production
camel.springboot.jmx-enabled=false
camel.debug.enabled=false
camel.springboot.backlog-tracing=false
camel.debug.standby=false
camel.debug.jmx-connector-enabled=false

# Management endpoints - Minimal exposure for production
# Only expose health and info endpoints for production monitoring
management.endpoints.web.exposure.include=health,info
