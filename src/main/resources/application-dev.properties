# Development Profile Configuration
# This profile is used for local development with STANDALONE Hawtio (via JBang)

# Camel Debug configuration - Enabled for development
camel.springboot.jmx-enabled=true
camel.springboot.backlog-tracing=true

# BacklogDebugger - this is what Hawtio uses for web-based debugging
camel.springboot.backlog-debugger-enabled=true
camel.springboot.backlog-debugger-standby=false

# Spring Boot JMX configuration
spring.jmx.enabled=true

# Jolokia endpoint for standalone Hawtio connection
management.endpoints.web.exposure.include=jolokia,health,info
